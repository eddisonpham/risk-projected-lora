[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskproj"
version = "0.0.1"
description = "Risk-Guided Activation Projection for LoRA Fine-Tuning of Contact-Rich VLAs"
readme = "agents/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Risk-Projected LoRA project" }]

# Core runtime: kept deliberately small so `tasks.py test` works on a CPU-only box.
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.1",
  "pydantic>=2.6",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "rich>=13.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "peft>=0.13",
  "safetensors>=0.4",
]
sim = [
  "mujoco>=3.1",
  "gymnasium>=1.0",
]
stats = ["rliable>=1.0"]
figures = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]
# Installed by `tasks.py bootstrap-sim`; heavy, network- and platform-sensitive.
vla = [
  "lerobot>=0.3",
  "transformers>=4.48",
  "datasets>=3.0",
  "huggingface-hub>=0.27",
]

[project.scripts]
riskproj = "riskproj.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, deterministic, no simulator and no GPU",
  "integration: exercises more than one module (may use a toy env/policy)",
  "sim: requires MuJoCo / Meta-World and the simulator extra",
  "gpu: requires a CUDA device and the ml extra",
  "slow: takes more than ~60 s or downloads assets",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/riskproj"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RET", "ARG", "NPY", "RUF"]
ignore = [
  "E501",    # long lines are fine when they carry a formula or a table
  "B008",    # pydantic/omegaconf defaults
  "RUF001",  # unicode in docstrings for math
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SLF001"]
"scripts/**" = ["T201", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["riskproj"]

# --------------------------------------------------------------------------
# mypy   (strict for the three claim-critical packages, pragmatic elsewhere)
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/riskproj", "tests", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["riskproj.projection.*", "riskproj.critic.*", "riskproj.eval.stats"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = false
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*", "tasks"]
disallow_untyped_defs = false
