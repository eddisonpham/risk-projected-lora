# Stage A: expert-only SFT of SmolVLA on nominal demos -> frozen pi_base (agents/05 §5).
# Without this the "frozen baseline" and the F1 fallback would be degenerate: a
# zero-shot community checkpoint cannot act in Meta-World (agents/01 §2).
train:
  stage: A
  steps: 10000
  batch_size: 8
  grad_accum: 4
  lr: 0.0001
  min_lr_ratio: 0.025
  warmup_steps: 100
  weight_decay: 0.0001
  betas: [0.9, 0.95]
  schedule: cosine
  dtype: bfloat16
  grad_clip: 1.0
  save_every: 2000
  eval_every: 1000
  log_every: 50
  num_workers: 0
  max_train_minutes: null
  lam: 0.0
