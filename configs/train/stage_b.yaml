# Stage B: LoRA adaptation on dynamics-diverse demos. Every method (B0-B6, C1-C3)
# shares this step budget, the data split and the seed set (agents/08 §1, §3):
# unequal budgets would make the comparison uninterpretable.
train:
  stage: B
  steps: 10000
  batch_size: 8
  grad_accum: 4
  lr: 0.0001
  min_lr_ratio: 0.025
  warmup_steps: 100
  weight_decay: 0.0001
  betas: [0.9, 0.95]
  schedule: cosine
  dtype: bfloat16
  grad_clip: 1.0
  save_every: 2000
  eval_every: 1000
  log_every: 50
  num_workers: 0
  max_train_minutes: null
  lam: 0.0
