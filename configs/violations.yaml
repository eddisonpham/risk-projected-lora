# Violation thresholds (agents/04 §4). Derived from *nominal scripted-expert rollouts
# only*, before any learned policy is evaluated, and then frozen. Written by
# `scripts/derive_violation_thresholds.py` (full record: configs/violations_derived.yaml).
# The toy task carries its own, separately documented spec (envs/toy.py).
#
# READ BEFORE USING. Three revisions stand between the first G1 sweep and these values,
# all decided on nominal/expert data only and all recorded in research_log/LOG.md:
#
# 1. **Rule: nominal max x margin, not the 99.5th percentile.** V1-V5 are *episode*
#    events; a percentile of the *step* distribution sits inside legitimate manipulation
#    (V4 fired in 62 % of nominal expert episodes).
# 2. **V3/V4/V5 are measured over manipulation contacts only** — the grasp pair
#    (gripper geom vs manipulated object) is excluded. How hard the gripper squeezes is
#    not a task failure: at nominal the pads indent into the peg by 8.6 mm, which set V4's
#    bar *above* the penetration the task itself produces (0.0026 m over manipulation
#    contacts). The all-contact values are still logged (`penetration_all`,
#    `force_pairs_all`) for the audit.
# 3. **These thresholds are derived from the *current* env semantics, and the derivation
#    now refuses to run otherwise.** The previous freeze was computed while the env fell
#    back to the distance grasp test, so V1's "slip" was the arm's approach motion: the bar
#    came out at 0.1239 m for a quantity that measures 0.0135 m under the contact test the
#    monitor actually uses. `provenance.grasp_test` records what the derivation saw, and a
#    fallback aborts it. V1's bar is consequently 6x lower than it was.
#
# KNOWN LIMITATION to report alongside any axis result: V4 is an *out-of-envelope* detector
# rather than a failure signature — penetration falls as the contact stiffens (measured
# 14.8 mm at stiff_scale 0.25 -> 4.4 mm at 4.0 over all contacts), so its rate is
# anti-correlated with the stiffness axis. V1 is now a real slip measure (the peg moves
# 0.021-0.026 m in the grasp at nominal), not a measure of required task motion.
violations:
  slip_drift: 0.020260611022844432 # V1, metres of gripper-frame drift within `window` steps
  drop_dist: 0.039047586857173744 # V2, metres the object leaves the gripper-frame offset by
  force_max: 1693.9596917141257 # V3, newtons of the LARGEST per-pair manipulation force
  penetration: 0.005153324466708175 # V4, metres of absolute depth over manipulation contacts
  jam_force: 1693.9596917141257 # V5, largest per-pair manipulation force sustained
  jam_progress_eps: 0.002 # V5, metres of progress that counts as "moving"
  jam_steps: 5 # V5, W consecutive steps
  window: 10 # steps for the V1/V2 windows
  horizon: 10 # H_c; must equal env.critic_horizon (asserted)
  provenance:
    status: derived
    generator: scripts/derive_violation_thresholds.py
    generator_version: 1
    source: scripted expert, nominal dynamics, nominal cell ONLY
    n_episodes: 50
    n_steps: 10000
    rule: nominal_max_x_margin
    grasp_test: [contact]
    contact_family: [manipulation (grasp pair excluded)]
    allow_distance_grasp: false
    nominal_peaks:
      slip_drift: 0.01350707401522962
      drop_dist: 0.02603172457144916
      force_max: 1129.3064611427505
      penetration: 0.005153324466708175
    margin: { V1: 1.5, V2: 1.5, V3: 1.5, V4: 1.0, V5: 1.5 }
    v4_is_absolute_depth: true
    v4_note: fires on softer-than-nominal contacts; report it with the axis
    learned_checkpoint_in_loop: false
    config_hash: a4f255f4
    git_sha: 06cbafd2815a64d82831c9d3da30ba105cf3b752
    derived_on: "2026-10-09 (before any learned policy was evaluated on this task)"
