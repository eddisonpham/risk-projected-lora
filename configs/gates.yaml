# Gate thresholds (agents/11). Committed BEFORE the gate is evaluated: changing a
# threshold after seeing a result is a protocol change and must be logged in
# agents/research_log/LOG.md (CLAUDE.md, "When blocked").
gates:
  # G1 — dynamics sensitivity: can this setup test the hypothesis at all?
  G1:
    n_scales: 7
    scale_lo: 0.25
    scale_hi: 4.0
    episodes_per_scale: 30
    pi_base_success_band: [0.30, 0.90] # headroom in both directions
    axis_shift_pp: 15.0 # success or violation shift across the axis range
    min_violation_rate: 0.05 # each of V1-V5 must occur somewhere
    # WHICH actors the coverage criterion is measured over (04 §8).
    #
    # PROTOCOL CHANGE, human-approved 2026-10-09 (logged in research_log/LOG.md,
    # iteration 8 / OPEN QUESTION 15). Measured: with bars derived from nominal expert
    # rollouts, the scripted expert evokes only V2 (mu axis) and V4 (stiff axis), and
    # V1/V3/V5 stay at 0.00 even under sigma=0.4 action noise -- an expert is *supposed*
    # to be failure-free, so measuring reachability on it alone asks the wrong question.
    # Coverage therefore runs the failure-inducing actor as well; every actor's per-scale
    # rates are reported either way, and the criterion names the actors it used.
    coverage_actors: [expert, perturbed]
    # Sigmas sit at the *success boundary*, which is where failures carry information.
    # Measured (perturb_chunk's convention, nominal dynamics, expert chunks): sigma=0.05 ->
    # success 0.75, 0.10 -> 0.33, 0.20 -> 0.00, 0.40 -> 0.00. The first list used 0.2/0.4,
    # i.e. two actors that never succeed and (measured) never load the contacts either
    # (peak per-pair force 30-102 N versus the expert's ~1.1 kN), which made V1/V3/V5 look
    # structurally unreachable when the boundary actor reaches 7.3 kN and 0.114 m of
    # penetration in a single episode.
    perturbed_sigmas: [0.05, 0.1]
  # G2 — VRAM budget. The whole model choice rests on this.
  G2:
    budget_gb: 7.0
    headroom_gb: 0.25
  # G3 — critic acceptance, on VAL (held-out combos) only.
  G3:
    auroc: 0.85
    auprc_mult: 2.0
    ece: 0.05
    fnr_at_tau: 0.15
    min_cell_auroc: 0.75
    require_val_disagreement_gt_train: true
  # G6 — falsification pilot sanity.
  G6:
    max_fallback_rate: 0.30
    max_action_suppression_rel: 0.25
